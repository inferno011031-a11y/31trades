<!DOCTYPE html>
<html lang="en" data-theme="dark" class="scroll-smooth">
<head>
    <!-- SEO:META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BattleXJournal — Trade with Proof, Not Memory</title>
    <meta name="description" content="BattleXJournal is the all-in-one private trading journal, market replay simulator, strategy lab, risk management engine, and AI trading coach.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Compiled Tailwind & Token Styles -->
    <link rel="stylesheet" href="assets/tailwind-compiled.css">
    <link rel="stylesheet" href="assets/trademind-theme.css">

    <!-- Self-Hosted Lucide Icons -->
    <script src="/assets/lucide.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Smooth Cursor & Standalone AI Test Chatbot -->
    <script src="/assets/cursor.js" defer></script>
    <script src="/assets/chat-test.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tm-bg: #090a0d;
            --tm-card: #121318;
            --tm-card-sub: #171821;
            --tm-border: rgba(255, 255, 255, 0.08);
            --tm-border-strong: rgba(255, 255, 255, 0.14);
            --emerald-glow: rgba(16, 185, 129, 0.15);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #08090c !important;
            background-color: #08090c !important;
            color: #FFFFFF !important;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Glassmorphism Classes */
        .glass-dock {
            background: rgba(14, 15, 20, 0.78) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-dock-top {
            max-width: 960px;
        }

        .nav-dock-scrolled {
            max-width: 1240px;
            background: rgba(10, 11, 15, 0.92) !important;
            border-color: rgba(255, 255, 255, 0.13);
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2px;
            display: inline-block;
        }

        .btn-cta-primary {
            background: #FFFFFF !important;
            color: #000000 !important;
            font-weight: 700 !important;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.5);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-cta-primary:hover {
            background: #F0FDF4 !important;
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.4), 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        /* Smooth Cursor Container */
        #smooth-cursor-container, #smooth-cursor-container * {
            pointer-events: none !important;
        }
        #smooth-cursor-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
            will-change: transform;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body class="antialiased selection:bg-emerald-500/20 selection:text-emerald-300">

    <!-- Directional Smooth Cursor Element -->
    <div id="smooth-cursor-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="48" viewBox="0 0 50 54" fill="none" style="transform: scale(0.6);">
            <g filter="url(#filter0_d_cursor)">
                <path d="M42.6817 41.1495L27.5103 6.79925C26.7269 5.02557 24.2082 5.02558 23.3927 6.79925L7.59814 41.1495C6.75833 42.9759 8.52712 44.8902 10.4125 44.1954L24.3757 39.0496C24.8829 38.8627 25.4385 38.8627 25.9422 39.0496L39.8121 44.1954C41.6849 44.8902 43.4884 42.9759 42.6817 41.1495Z" fill="#000000"/>
                <path d="M43.7146 40.6933L28.5431 6.34306C27.3556 3.65428 23.5772 3.69516 22.3668 6.32755L6.57226 40.6778C5.3134 43.4156 7.97238 46.298 10.803 45.2549L24.7662 40.109C25.0221 40.0147 25.2999 40.0156 25.5494 40.1082L39.4193 45.254C42.2261 46.2953 44.9254 43.4347 43.7146 40.6933Z" stroke="#34d399" stroke-width="2.5"/>
            </g>
            <defs>
                <filter id="filter0_d_cursor" x="0" y="0" width="50" height="54" filterUnits="userSpaceOnUse">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
                </filter>
            </defs>
        </svg>
    </div>

    <!-- Background Grid & Glows -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <svg aria-hidden="true" class="absolute inset-0 h-full w-full stroke-white/[0.03] [mask-image:radial-gradient(1100px_circle_at_center,white,transparent)]">
            <defs>
                <pattern id="grid-pattern" width="48" height="48" patternUnits="userSpaceOnUse" x="-1" y="-1">
                    <path d="M.5 48V.5H48" fill="none" stroke-width="1" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" stroke-width="0" fill="url(#grid-pattern)" />
        </svg>

        <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[850px] h-[550px] rounded-full blur-[140px]" style="background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);"></div>
    </div>

    <!-- ==================== 1. FLOATING NAVIGATION DOCK ==================== -->
    <header class="fixed top-4 sm:top-6 inset-x-0 z-50 flex justify-center px-4">
        <div id="nav-container" class="glass-dock nav-dock-top w-full rounded-2xl px-4 sm:px-6 py-3 flex items-center justify-between">
            
            <!-- Logo -->
            <a href="/" class="logo flex items-center gap-2.5 text-decoration-none group">
                <img src="assets/battlex-logo.png" alt="BattleX Logo" class="logo-badge">
                <span class="font-extrabold text-base tracking-tight text-white flex items-center gap-1">
                    BATTLEX<span class="text-emerald-400">JOURNAL</span>
                </span>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-1 text-[13.5px] font-medium text-zinc-400">
                <a href="#cockpit" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-white/5 transition-colors">Cockpit</a>
                <a href="#features" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-white/5 transition-colors">Features</a>
                <a href="#replay" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-white/5 transition-colors">Market Replay</a>
                <a href="#compare" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-white/5 transition-colors">Why BattleX</a>
                <a href="#pricing" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-white/5 transition-colors">Pricing</a>
                <a href="#faq" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-white/5 transition-colors">FAQ</a>
            </nav>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 sm:gap-3">
                <a href="auth.html" class="text-[13px] font-semibold text-zinc-300 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 transition-colors">
                    Sign In
                </a>
                <a href="auth.html" class="btn-cta-primary text-[13px] px-4 py-2 rounded-xl flex items-center gap-1.5">
                    <span>Start Free</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </a>
            </div>

        </div>
    </header>

    <!-- Clean Main Canvas Area -->
    <main class="relative z-10 min-h-screen pt-32 sm:pt-40 pb-20 px-4 sm:px-6 flex flex-col items-center justify-center text-center">
        <h1 class="sr-only">BattleXJournal — Next-Gen Trading Journal & Operating System</h1>
    </main>

    <!-- Interactive Logic -->
    <script>
        // Dynamic Dock Morph on Scroll
        const navContainer = document.getElementById('nav-container');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY || window.pageYOffset;
            if (navContainer) {
                if (scrollY > 30) {
                    navContainer.classList.remove('nav-dock-top');
                    navContainer.classList.add('nav-dock-scrolled');
                } else {
                    navContainer.classList.remove('nav-dock-scrolled');
                    navContainer.classList.add('nav-dock-top');
                }
            }
        }, { passive: true });

        // Initialize Self-Hosted Icons
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
