    <script>
        (function() {
            'use strict';
            const $ = id => document.getElementById(id);
            const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            const fmtMoney = n => (n >= 0 ? '+' : '-') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
            const fmtR = r => (r >= 0 ? '+' : '') + Number(r || 0).toFixed(2) + 'R';

            let trades = [];
            let activeTradeId = null;
            let activeFilter = 'all';
            let searchQuery = '';

            function getCore() {
                return window.TradeMindCore || null;
            }

            function loadTrades() {
                const core = getCore();
                if (!core || !core.Trades) return [];
                const sel = core.selectedAccountId ? core.selectedAccountId() : null;
                return core.Trades
                    .filter(t => !sel || t.account_id === sel)
                    .map(t => ({
                        ...t,
                        ts: new Date(t.ts),
                        note: t.note || '',
                        emotion: t.emotion || '',
                        adherence: t.adherence || 'followed'
                    }))
                    .sort((a, b) => b.ts - a.ts);
            }

            function getFilteredTrades() {
                return trades.filter(t => {
                    if (activeFilter === 'annotated' && !t.note) return false;
                    if (activeFilter === 'empty' && !!t.note) return false;
                    if (activeFilter === 'winners' && t.pnl <= 0) return false;
                    if (activeFilter === 'losers' && t.pnl >= 0) return false;

                    if (searchQuery) {
                        const hay = (t.symbol + ' ' + (t.setup || '') + ' ' + (t.note || '') + ' ' + (t.emotion || '') + ' ' + (t.session || '')).toLowerCase();
                        if (!hay.includes(searchQuery.toLowerCase())) return false;
                    }
                    return true;
                });
            }

            function renderFeed() {
                const list = getFilteredTrades();
                const container = $('trades-list');
                const annotatedCount = trades.filter(t => !!t.note).length;
                $('feed-stats').textContent = annotatedCount + ' / ' + trades.length + ' Annotated';

                if (!list.length) {
                    container.innerHTML = '<div class="py-12 text-center text-[#64748b] text-[13px]">No trades match your search or filter.</div>';
                    return;
                }

                container.innerHTML = list.map(t => {
                    const isActive = t.id === activeTradeId;
                    const pnlCls = t.pnl >= 0 ? 'text-[#34d399]' : 'text-[#f87171]';
                    const dirTag = t.dir === 'Long' ? '<span class="tag tag-emerald !py-0 !px-1.5 text-[10px]">Long</span>' : '<span class="tag tag-red !py-0 !px-1.5 text-[10px]">Short</span>';

                    return '<div class="trade-feed-item ' + (isActive ? 'active' : '') + '" data-trade-id="' + t.id + '">' +
                        '<div class="flex items-center justify-between gap-2">' +
                            '<div class="flex items-center gap-2">' +
                                '<span class="font-bold text-[13.5px] text-white">' + esc(t.symbol) + '</span>' +
                                dirTag +
                            '</div>' +
                            '<div class="text-right">' +
                                '<span class="num font-bold text-[13px] ' + pnlCls + '">' + fmtMoney(t.pnl) + '</span> ' +
                                '<span class="num text-[11px] ' + pnlCls + ' opacity-80">(' + fmtR(t.r) + ')</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex items-center justify-between text-[11px] text-[#94a3b8] mt-1.5">' +
                            '<span>' + new Date(t.ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + '</span>' +
                            '<span>' + (esc(t.setup) || '—') + ' · ' + (esc(t.session) || '—') + '</span>' +
                        '</div>' +
                        '<div class="mt-2.5 pt-2 border-t border-white/5 flex items-center justify-between text-[11.5px]">' +
                            '<div class="flex items-center gap-1.5 text-[#94a3b8] truncate max-w-[240px]">' +
                                '<span class="w-1.5 h-1.5 rounded-full ' + (t.note ? 'bg-sky-400' : 'bg-zinc-600') + '"></span>' +
                                '<span class="truncate ' + (t.note ? 'text-zinc-300' : 'italic text-zinc-500') + '">' + (t.note ? esc(t.note) : 'Add reflection…') + '</span>' +
                            '</div>' +
                            (t.emotion ? '<span class="tag tag-gray !py-0 !px-1.5 text-[10px]">● ' + esc(t.emotion) + '</span>' : '') +
                        '</div>' +
                    '</div>';
                }).join('');
            }

            function saveStudioNotes() {
                const t = trades.find(x => x.id === activeTradeId);
                if (!t) return;

                const note = $('studio-notes') ? $('studio-notes').value.trim() : t.note;
                const emotion = t.emotion || '';
                const adherence = t.adherence || 'followed';
                const chart_url = $('studio-chart') ? $('studio-chart').value.trim() : t.chart_url;

                t.note = note;
                t.chart_url = chart_url;

                const core = getCore();
                if (core && core.TradeService) {
                    try {
                        core.TradeService.update(t.id, { note, emotion, adherence, chart_url });
                    } catch (e) {
                        console.warn('TradeService update fallback:', e);
                    }
                }

                const statusEl = $('save-status');
                if (statusEl) statusEl.textContent = 'Saved just now';
                showToast('Trade reflection saved');
                renderFeed();
            }

            function appendStudioTag(tag) {
                const noteEl = $('studio-notes');
                if (!noteEl) return;
                const cur = noteEl.value.trim();
                if (cur.includes(tag)) return;
                noteEl.value = cur ? cur + '\n• ' + tag : '• ' + tag;
                noteEl.focus();
                saveStudioNotes();
            }

            function selectEmotion(em) {
                const t = trades.find(x => x.id === activeTradeId);
                if (!t) return;
                t.emotion = (t.emotion === em ? '' : em);
                saveStudioNotes();
                renderStudio();
            }

            function selectAdherence(adh) {
                const t = trades.find(x => x.id === activeTradeId);
                if (!t) return;
                t.adherence = adh;
                saveStudioNotes();
                renderStudio();
            }

            function clearStudioNotes() {
                const noteEl = $('studio-notes');
                if (noteEl) noteEl.value = '';
                saveStudioNotes();
            }

            window.saveStudioNotes = saveStudioNotes;
            window.appendStudioTag = appendStudioTag;
            window.selectEmotion = selectEmotion;
            window.selectAdherence = selectAdherence;
            window.clearStudioNotes = clearStudioNotes;

            function renderStudio() {
                const t = trades.find(x => x.id === activeTradeId);
                const container = $('studio-content');

                if (!t) {
                    container.innerHTML = '<div class="py-24 text-center text-[#64748b] flex flex-col items-center">' +
                        '<svg data-lucide="book-open" class="w-12 h-12 mb-3 text-white/20"></svg>' +
                        '<h3 class="text-[16px] font-bold text-white">Select a Trade</h3>' +
                        '<p class="text-[13px] mt-1 max-w-sm text-[#94a3b8]">Choose a trade from the ledger to document your thesis, execution decisions, and chart evidence.</p>' +
                    '</div>';
                    if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
                    return;
                }

                const pnlCls = t.pnl >= 0 ? 'text-[#34d399]' : 'text-[#f87171]';
                
                // Professional execution tags without emojis
                const quickTags = [
                    'Waited for setup', 'Respected stop loss', 'High R:R execution', 'Target hit',
                    'Early exit', 'FOMO impulse', 'Revenge trade', 'Moved stop loss', 'Oversized risk', 'Hesitated on entry'
                ];

                // Emotions without emojis, using clean dots
                const emotions = [
                    { id: 'Calm', label: 'Calm', dot: 'bg-emerald-400' },
                    { id: 'Confident', label: 'Confident', dot: 'bg-sky-400' },
                    { id: 'FOMO', label: 'FOMO', dot: 'bg-amber-400' },
                    { id: 'Revenge', label: 'Revenge', dot: 'bg-rose-400' },
                    { id: 'Anxious', label: 'Anxious', dot: 'bg-yellow-400' },
                    { id: 'Greed', label: 'Greed', dot: 'bg-purple-400' },
                    { id: 'Bored', label: 'Bored', dot: 'bg-zinc-400' }
                ];

                // Adherences without emojis
                const adherences = [
                    { v: 'followed', l: 'Followed plan' },
                    { v: 'early exit', l: 'Early exit' },
                    { v: 'moving stop', l: 'Moved stop loss' },
                    { v: 'no-plan', l: 'No predefined plan' },
                    { v: 'oversized', l: 'Oversized risk' },
                    { v: 'chased', l: 'Chased entry' }
                ];

                const tagButtons = quickTags.map(tag => {
                    return '<button type="button" class="btn-mini !py-1 !px-2.5 text-[11.5px] tag-pill-btn" data-tag="' + esc(tag) + '"><span class="w-1 h-1 rounded-full bg-zinc-400"></span> ' + esc(tag) + '</button>';
                }).join('');

                const emotionPills = emotions.map(em => {
                    const isSel = (t.emotion === em.id);
                    return '<button type="button" class="selectable-pill ' + (isSel ? 'active' : '') + '" onclick="selectEmotion(\'' + em.id + '\')"><span class="w-1.5 h-1.5 rounded-full ' + em.dot + '"></span> ' + em.label + '</button>';
                }).join('');

                const adherencePills = adherences.map(adh => {
                    const isSel = (t.adherence === adh.v);
                    return '<button type="button" class="selectable-pill ' + (isSel ? 'active' : '') + '" onclick="selectAdherence(\'' + adh.v + '\')">' + adh.l + '</button>';
                }).join('');

                container.innerHTML = '' +
                    '<div class="p-5 bg-[#0e121b] border border-white/10 rounded-2xl flex flex-wrap items-center justify-between gap-4">' +
                        '<div class="flex items-center gap-3.5">' +
                            '<div class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center font-extrabold text-[16px]">' +
                                esc(t.symbol.slice(0, 3)) +
                            '</div>' +
                            '<div>' +
                                '<div class="flex items-center gap-2">' +
                                    '<h2 class="text-[18px] font-bold text-white">' + esc(t.symbol) + '</h2>' +
                                    '<span class="tag ' + (t.dir === 'Long' ? 'tag-emerald' : 'tag-red') + '">' + esc(t.dir) + '</span>' +
                                    '<span class="tag tag-gray text-[11px]">' + (esc(t.setup) || 'Breakout') + '</span>' +
                                '</div>' +
                                '<div class="text-[12px] text-[#94a3b8] mt-0.5">' +
                                    new Date(t.ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · ' + (esc(t.session) || 'London') + ' Session' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex items-center gap-6">' +
                            '<div><div class="text-[11px] text-[#94a3b8] font-semibold uppercase">Net P&amp;L</div><div class="num text-[20px] font-extrabold ' + pnlCls + ' mt-0.5">' + fmtMoney(t.pnl) + '</div></div>' +
                            '<div><div class="text-[11px] text-[#94a3b8] font-semibold uppercase">R Multiple</div><div class="num text-[20px] font-extrabold ' + pnlCls + ' mt-0.5">' + fmtR(t.r) + '</div></div>' +
                            '<div><div class="text-[11px] text-[#94a3b8] font-semibold uppercase">Risk</div><div class="num text-[20px] font-extrabold text-white mt-0.5">$' + (t.risk || 0) + '</div></div>' +
                        '</div>' +
                    '</div>' +

                    '<div class="p-6 bg-[#0e121b] border border-white/10 rounded-2xl flex flex-col gap-4">' +
                        '<div class="flex items-center justify-between">' +
                            '<div class="flex items-center gap-2">' +
                                '<svg data-lucide="file-text" class="w-5 h-5 text-white"></svg>' +
                                '<h3 class="text-[16px] font-bold text-white">Trade Narrative &amp; Notes</h3>' +
                            '</div>' +
                            '<span id="save-status" class="text-[11.5px] text-[#94a3b8] font-medium">Auto-saves on typing</span>' +
                        '</div>' +

                        '<div>' +
                            '<label class="text-[11.5px] font-semibold uppercase tracking-wider text-[#94a3b8] mb-1.5 block">Trade Thesis &amp; Management</label>' +
                            '<textarea id="studio-notes" class="dark-ctrl w-full min-h-[160px] text-[13.5px] leading-relaxed p-3.5 font-normal" placeholder="Document setup thesis, market structure, execution triggers, and trade management reflections…">' + esc(t.note || '') + '</textarea>' +
                        '</div>' +

                        '<div>' +
                            '<div class="text-[11px] font-semibold uppercase tracking-wider text-[#94a3b8] mb-2">Execution Tags (Click to append)</div>' +
                            '<div class="flex flex-wrap gap-1.5">' + tagButtons + '</div>' +
                        '</div>' +

                        '<div class="pt-3 border-t border-white/5 flex flex-col gap-3">' +
                            '<div>' +
                                '<label class="text-[11px] font-semibold uppercase tracking-wider text-[#94a3b8] mb-1.5 block">Emotion State at Entry</label>' +
                                '<div class="flex flex-wrap gap-1.5">' + emotionPills + '</div>' +
                            '</div>' +
                            '<div class="pt-2">' +
                                '<label class="text-[11px] font-semibold uppercase tracking-wider text-[#94a3b8] mb-1.5 block">Plan Adherence</label>' +
                                '<div class="flex flex-wrap gap-1.5">' + adherencePills + '</div>' +
                            '</div>' +
                        '</div>' +

                        '<div class="pt-3 border-t border-white/5">' +
                            '<label class="text-[11px] font-semibold uppercase tracking-wider text-[#94a3b8] mb-1.5 block">Chart Snapshot URL</label>' +
                            '<div class="flex items-center gap-2">' +
                                '<input type="url" id="studio-chart" class="dark-ctrl flex-1 text-[13px] px-3 py-2" placeholder="https://www.tradingview.com/x/... or chart link" value="' + esc(t.chart_url || '') + '">' +
                                (t.chart_url ? '<a href="' + esc(t.chart_url) + '" target="_blank" class="btn-ghost !py-2 !px-3 text-[12.5px]"><svg data-lucide="external-link" class="w-4 h-4"></svg> View Chart</a>' : '') +
                            '</div>' +
                        '</div>' +

                        '<div class="flex items-center justify-between pt-4 border-t border-white/5">' +
                            '<div class="flex items-center gap-2">' +
                                '<button type="button" class="btn-ghost !py-2 !px-3 text-[12.5px]" onclick="clearStudioNotes()">Clear Notes</button>' +
                                '<a href="journal.html" class="btn-ghost !py-2 !px-3 text-[12.5px]"><svg data-lucide="book-open" class="w-3.5 h-3.5"></svg> View in Journal</a>' +
                            '</div>' +
                            '<button type="button" class="btn-primary !py-2 !px-5 text-[13.5px]" onclick="saveStudioNotes()">' +
                                '<svg data-lucide="save" class="w-4 h-4"></svg> Save Reflection' +
                            '</button>' +
                        '</div>' +
                    '</div>';

                const noteInput = $('studio-notes');
                const chartInput = $('studio-chart');

                let debounceTimer;
                const triggerAutoSave = () => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(saveStudioNotes, 600);
                };

                if (noteInput) noteInput.addEventListener('input', triggerAutoSave);
                if (chartInput) chartInput.addEventListener('input', triggerAutoSave);

                // Attach event listener for tag buttons
                container.querySelectorAll('.tag-pill-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        appendStudioTag(btn.dataset.tag);
                    });
                });

                if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
            }

            function showToast(msg) {
                $('toast-msg').textContent = msg;
                $('toast').classList.add('show');
                setTimeout(() => $('toast').classList.remove('show'), 2400);
            }

            // Events
            const collapseBtn = $('collapse-btn');
            if (collapseBtn) collapseBtn.addEventListener('click', () => document.body.classList.toggle('collapsed'));

            document.addEventListener('click', e => {
                const item = e.target.closest('.trade-feed-item');
                if (item) {
                    activeTradeId = item.dataset.tradeId;
                    renderFeed();
                    renderStudio();
                }
            });

            document.querySelectorAll('[data-filter]').forEach(b => {
                b.addEventListener('click', () => {
                    document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    activeFilter = b.dataset.filter;
                    renderFeed();
                });
            });

            const searchInput = $('note-search');
            if (searchInput) {
                searchInput.addEventListener('input', e => {
                    searchQuery = e.target.value.trim();
                    renderFeed();
                });
            }

            // Initial load
            trades = loadTrades();
            if (trades.length) {
                activeTradeId = trades[0].id;
            }

            renderFeed();
            renderStudio();
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();

            const core = getCore();
            if (core && core.TradeMindBus) {
                core.TradeMindBus.subscribe('trade.created', () => { trades = loadTrades(); renderFeed(); });
                core.TradeMindBus.subscribe('trade.updated', () => { trades = loadTrades(); renderFeed(); });
            }
        })();
    </script>
</body>
</html>
